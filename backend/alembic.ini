[alembic]
# Path to migrations directory, relative to this file
script_location = migrations

# Prepend repo root to sys.path so `shared.config` and `backend.db` import cleanly
prepend_sys_path = ..

# Template used when generating new revisions via `alembic revision -m "..."`
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
